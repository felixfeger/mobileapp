<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#003f8a"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="City Metro"/>
  <meta name="description" content="City Metro — Live arrivals, trip planning, maps and alerts."/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <link rel="manifest" href="manifest.json"/>
  <title>City Metro</title>
  <style>
    :root {
      --navy:     #003f8a;
      --blue:     #1558b0;
      --sky:      #e8f0fe;
      --bg:       #f4f6fa;
      --surface:  #ffffff;
      --border:   #dde3ed;
      --text:     #0b1526;
      --text2:    #2c3e5a;
      --muted:    #5f718f;
      --muted2:   #9aabc0;
      --green:    #0a7c4a;
      --amber:    #92640a;
      --red:      #c0212b;
      --safe-t:   env(safe-area-inset-top, 0px);
      --safe-b:   env(safe-area-inset-bottom, 0px);
      --font:     'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-cond:'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: var(--font);
      background: var(--navy);
      -webkit-font-smoothing: antialiased;
    }

    /* ── APP SHELL ── */
    .app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden;
    }

    /* status bar fill for iOS notch */
    .ios-bar {
      height: var(--safe-t);
      background: var(--navy);
      flex-shrink: 0;
    }

    /* ── TOPBAR ── */
    .topbar {
      height: 54px;
      flex-shrink: 0;
      background: var(--navy);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,20,80,.3);
      position: relative;
      z-index: 200;
    }

    .menu-btn {
      width: 36px;
      height: 36px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border-radius: 8px;
      transition: background .15s;
    }

    .menu-btn:hover {
      background: rgba(255,255,255,.1);
    }

    .menu-btn svg {
      stroke: white;
    }

    .topbar-title {
      font-family: var(--font-cond);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: white;
      flex: 1;
      text-align: center;
    }

    .topbar-logo {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: contain;
      background: white;
      padding: 2px;
      flex-shrink: 0;
    }

    /* ── DRAWER MENU ── */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
    }

    .drawer-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .drawer {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 280px;
      background: var(--surface);
      z-index: 400;
      transform: translateX(-100%);
      transition: transform .28s cubic-bezier(.4,0,.2,1);
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 24px rgba(0,0,0,.2);
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      background: var(--navy);
      padding: calc(var(--safe-t) + 24px) 20px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .drawer-logo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: contain;
      background: white;
      padding: 3px;
    }

    .drawer-brand h2 {
      font-family: var(--font-cond);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: white;
      line-height: 1;
    }

    .drawer-brand p {
      font-size: 11px;
      color: rgba(255,255,255,.65);
      margin-top: 3px;
    }

    .drawer-nav {
      flex: 1;
      overflow-y: auto;
      padding: 12px 0;
    }

    .drawer-section-label {
      font-family: var(--font-cond);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted2);
      padding: 12px 20px 6px;
    }

    .drawer-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 20px;
      cursor: pointer;
      transition: background .15s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .drawer-item:hover {
      background: var(--bg);
    }

    .drawer-item.active {
      background: var(--sky);
    }

    .drawer-item.active .di-label {
      color: var(--navy);
      font-weight: 600;
    }

    .drawer-item.active .di-icon {
      background: var(--navy);
    }

    .drawer-item.active .di-icon svg {
      stroke: white;
    }

    .di-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background .15s;
    }

    .di-icon svg {
      width: 18px;
      height: 18px;
      stroke: var(--muted);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke .15s;
    }

    .di-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text2);
    }

    .drawer-footer {
      padding: 16px 20px calc(var(--safe-b) + 16px);
      border-top: 1px solid var(--border);
      font-size: 10px;
      color: var(--muted2);
      line-height: 1.7;
      text-align: center;
    }

    /* ── CONTENT ── */
    .content {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .page {
      position: absolute;
      inset: 0;
      display: none;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--bg);
    }

    .page.active {
      display: block;
    }

    /* iframe pages */
    .iframe-page {
      position: absolute;
      inset: 0;
      display: none;
      overflow: hidden;
    }

    .iframe-page.active {
      display: flex;
      flex-direction: column;
    }

    .iframe-page iframe {
      flex: 1;
      border: none;
      width: 100%;
      height: 100%;
    }

    .iframe-loading {
      position: absolute;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: opacity .3s;
    }

    .iframe-loading.done {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 3px solid var(--border);
      border-top-color: var(--navy);
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-lbl {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }

    /* ── BOTTOM TAB BAR ── */
    .tabbar {
      flex-shrink: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      padding-bottom: var(--safe-b);
      box-shadow: 0 -2px 10px rgba(0,20,60,.07);
      z-index: 100;
    }

    .tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 8px 2px;
      cursor: pointer;
      border: none;
      background: none;
      min-height: 58px;
      transition: opacity .1s;
    }

    .tab:active {
      opacity: .6;
    }

    .tab-icon-wrap {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s;
    }

    .tab.active .tab-icon-wrap {
      background: rgba(0,63,138,.1);
    }

    .tab-icon-wrap svg {
      width: 20px;
      height: 20px;
      stroke: var(--muted2);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke .15s;
    }

    .tab.active .tab-icon-wrap svg {
      stroke: var(--navy);
    }

    .tab-lbl {
      font-size: 9.5px;
      font-weight: 600;
      color: var(--muted2);
      letter-spacing: 0.01em;
      transition: color .15s;
    }

    .tab.active .tab-lbl {
      color: var(--navy);
    }

    /* ════════════════════════════════════════════
       HOME PAGE
    ════════════════════════════════════════════ */

    .home-hero {
      background: var(--navy);
      padding: 24px 18px 32px;
      color: white;
    }

    .home-hero h1 {
      font-family: var(--font-cond);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.2;
      margin-bottom: 16px;
    }

    .home-hero h1 span {
      opacity: .7;
      display: block;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    /* Search bar */
    .search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: white;
      border-radius: 10px;
      padding: 10px 14px;
    }

    .search-bar svg {
      width: 18px;
      height: 18px;
      stroke: var(--muted2);
      flex-shrink: 0;
    }

    .search-bar input {
      flex: 1;
      border: none;
      outline: none;
      font-family: var(--font);
      font-size: 14px;
      color: var(--text);
      background: none;
    }

    .search-bar input::placeholder {
      color: var(--muted2);
    }

    /* Quick cards */
    .section-head {
      display: flex;
      align-items: center;
      padding: 20px 18px 10px;
    }

    .section-head h2 {
      font-family: var(--font-cond);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 18px;
    }

    .nav-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 14px;
      cursor: pointer;
      text-decoration: none;
      display: block;
      transition: transform .15s, box-shadow .15s;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-card:active {
      transform: scale(.97);
    }

    .nav-card:hover {
      box-shadow: 0 4px 16px rgba(0,20,60,.09);
    }

    .nc-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 10px;
    }

    .nc-title {
      font-family: var(--font-cond);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .nc-desc {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }

    /* Line status */
    .status-card {
      margin: 0 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .status-row:last-child {
      border-bottom: none;
    }

    /*
      LINE IMAGE
      The image is intentionally separate from the line name.
      Paste your Wikipedia/Wikimedia image URL into the src="" below.
    */
    .line-image {
      width: 32px;
      height: 32px;
      object-fit: contain;
      flex-shrink: 0;
      display: block;
    }

    .status-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      flex: 1;
    }

    .status-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 99px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .status-badge.good {
      background: #d1fae5;
      color: #065f46;
    }

    .status-badge.alert {
      background: #fef3c7;
      color: #92400e;
    }

    .home-footer {
      text-align: center;
      padding: 24px 18px 8px;
      font-size: 11px;
      color: var(--muted2);
      line-height: 1.8;
      border-top: 1px solid var(--border);
      margin-top: 20px;
    }

    /* ════════════════════════════════════════════
       SUPPORT PAGE
    ════════════════════════════════════════════ */

    .support-hero {
      background: var(--navy);
      padding: 28px 20px 32px;
      color: white;
    }

    .support-hero h1 {
      font-family: var(--font-cond);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .support-hero p {
      font-size: 13px;
      opacity: .7;
    }

    .support-body {
      padding: 20px 18px 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .support-section-label {
      font-family: var(--font-cond);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* Contact methods */
    .contact-cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .contact-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .cc-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .cc-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 3px;
    }

    .cc-value {
      font-size: 14px;
      font-weight: 700;
      color: var(--navy);
      text-decoration: none;
      display: block;
      margin-bottom: 3px;
    }

    .cc-value:hover {
      text-decoration: underline;
    }

    .cc-hours {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* Form */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .form-card h3 {
      font-family: var(--font-cond);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 16px;
    }

    .form-field {
      margin-bottom: 12px;
    }

    .form-field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .form-field input,
    .form-field select,
    .form-field textarea {
      width: 100%;
      background: var(--bg);
      border: 1.5px solid var(--border);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      appearance: none;
    }

    .form-field input:focus,
    .form-field select:focus,
    .form-field textarea:focus {
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(0,63,138,.1);
    }

    .form-field textarea {
      resize: vertical;
      min-height: 100px;
    }

    .submit-btn {
      width: 100%;
      background: var(--navy);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-family: var(--font-cond);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .15s;
    }

    .submit-btn:hover {
      background: var(--blue);
    }

    .form-success {
      display: none;
      background: #d1fae5;
      border: 1px solid #a7f3d0;
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      font-size: 13px;
      color: #065f46;
      margin-top: 12px;
    }

    /* ── SSO / AUTH ── */
    .auth-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }

    .auth-bar.signed-in {
      background: #f0fdf4;
      border-color: #a7f3d0;
    }

    .auth-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--navy);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .auth-info {
      flex: 1;
    }

    .auth-name {
      font-weight: 600;
      color: var(--text);
      font-size: 13px;
    }

    .auth-sub {
      font-size: 10px;
      color: var(--muted);
      margin-top: 1px;
    }

    .auth-btn {
      font-family: var(--font);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: background .15s;
    }

    .auth-btn.sign-in {
      background: var(--navy);
      color: white;
    }

    .auth-btn.sign-in:hover {
      background: var(--blue);
    }

    .auth-btn.sign-out {
      background: #fef2f2;
      color: var(--red);
      border: 1px solid #fecaca;
    }

    /* SSO modal */
    .sso-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 500;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
    }

    .sso-modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .sso-modal {
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      padding: 28px 24px calc(var(--safe-b) + 28px);
      width: 100%;
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
    }

    .sso-modal-overlay.open .sso-modal {
      transform: translateY(0);
    }

    .sso-modal h3 {
      font-family: var(--font);
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      text-align: center;
    }

    .sso-modal p {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 22px;
    }

    .sso-field {
      margin-bottom: 12px;
    }

    .sso-field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .sso-field input {
      width: 100%;
      background: var(--bg);
      border: 1.5px solid var(--border);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      padding: 11px 12px;
      border-radius: 8px;
      outline: none;
      transition: border-color .15s;
    }

    .sso-field input:focus {
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(0,63,138,.1);
    }

    .sso-login-btn {
      width: 100%;
      background: var(--navy);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 4px;
      transition: background .15s;
    }

    .sso-login-btn:hover {
      background: var(--blue);
    }

    .sso-cancel {
      width: 100%;
      background: none;
      border: none;
      padding: 12px;
      font-family: var(--font);
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      margin-top: 4px;
    }

    .sso-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      color: var(--red);
      margin-bottom: 12px;
      display: none;
    }

    .support-footer {
      text-align: center;
